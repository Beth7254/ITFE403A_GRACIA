<div class="announcement-card" *ngFor="let announcement of announcements">
  <h2>{{ announcement.title }}</h2>

  <p>{{ announcement.body }}</p>

  <span> <strong>Author:</strong> {{ announcement.author }} </span>

  <span> <strong>Date:</strong> {{ announcement.date }} </span>
</div>


<div class="student-list">
  <h2>Student List</h2>

  <div
    class="student-card"
    *ngFor="let student of students; let i = index">
    <h3>#{{ i + 1 }} {{ student.name }}</h3>
    <p>{{ student.course }} • {{ student.year }}</p>
  </div>
</div>
